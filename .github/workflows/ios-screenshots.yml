name: iOS Screenshots

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  BUNDLE_IDENTIFIER: com.renan.VinylShelf
  DERIVED_DATA_PATH: ${{ github.workspace }}/VinylShelfScreenshotDerivedData
  SCREENSHOT_DIRECTORY: ${{ github.workspace }}/screenshots

jobs:
  screenshots:
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for iOS Simulator
        run: |
          xcodebuild \
            -project VinylShelf.xcodeproj \
            -scheme VinylShelf \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Verify generated launch screen
        run: |
          set -euo pipefail

          APP_PATH="$DERIVED_DATA_PATH/Build/Products/Debug-iphonesimulator/VinylShelf.app"
          INFO_PLIST="$APP_PATH/Info.plist"

          test -f "$INFO_PLIST"

          if ! /usr/libexec/PlistBuddy -c "Print :UILaunchScreen" "$INFO_PLIST"; then
            echo "The compiled app is missing the UILaunchScreen Info.plist key."
            exit 1
          fi

      - name: Create and boot simulator
        run: |
          set -euo pipefail

          DEVICE_TYPE_ID="$(
            xcrun simctl list devicetypes --json \
              | jq -r 'first(.devicetypes[] | select(.name == "iPhone 17 Pro") | .identifier) // empty'
          )"
          RUNTIME_ID="$(
            xcrun simctl list runtimes --json \
              | jq -r '[.runtimes[] | select(.isAvailable == true and (.identifier | contains("SimRuntime.iOS-")))] | sort_by(.version | split(".") | map(tonumber)) | last | .identifier'
          )"

          if [[ -z "$DEVICE_TYPE_ID" || -z "$RUNTIME_ID" || "$RUNTIME_ID" == "null" ]]; then
            echo "An available iPhone 17 Pro simulator could not be found."
            exit 1
          fi

          SIMULATOR_UDID="$(
            xcrun simctl create \
              "VinylShelf Screenshots" \
              "$DEVICE_TYPE_ID" \
              "$RUNTIME_ID"
          )"
          echo "SIMULATOR_UDID=$SIMULATOR_UDID" >> "$GITHUB_ENV"

          xcrun simctl boot "$SIMULATOR_UDID"
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b

          if ! xcrun simctl ui "$SIMULATOR_UDID" appearance light; then
            echo "::warning::Unable to force light appearance on this runtime."
          fi

          if ! xcrun simctl status_bar \
            "$SIMULATOR_UDID" \
            override \
            --time "9:41" \
            --wifiMode active \
            --wifiBars 3 \
            --cellularMode active \
            --cellularBars 4 \
            --batteryState charged \
            --batteryLevel 100; then
            echo "::warning::Unable to standardize the simulator status bar."
          fi

      - name: Install, launch, and capture catalog
        run: |
          set -euo pipefail

          APP_PATH="$DERIVED_DATA_PATH/Build/Products/Debug-iphonesimulator/VinylShelf.app"
          test -d "$APP_PATH"

          xcrun swiftc \
            -parse-as-library \
            .github/scripts/validate-screenshot.swift \
            -o "$RUNNER_TEMP/validate-screenshot"

          xcrun simctl install "$SIMULATOR_UDID" "$APP_PATH"

          DATA_CONTAINER="$(
            xcrun simctl get_app_container \
              "$SIMULATOR_UDID" \
              "$BUNDLE_IDENTIFIER" \
              data
          )"
          READY_FILE="$DATA_CONTAINER/Library/Caches/vinylshelf-screenshot-ready"
          rm -f "$READY_FILE"

          xcrun simctl launch \
            --terminate-running-process \
            "$SIMULATOR_UDID" \
            "$BUNDLE_IDENTIFIER" \
            --screenshot-demo

          INTERFACE_READY=false
          for attempt in {1..60}; do
            if [[ -f "$READY_FILE" ]]; then
              INTERFACE_READY=true
              echo "Catalog ready after $attempt readiness checks."
              break
            fi

            sleep 1
          done

          if [[ "$INTERFACE_READY" != "true" ]]; then
            echo "The catalog did not signal readiness within 60 seconds."
            exit 1
          fi

          xcrun simctl launch \
            "$SIMULATOR_UDID" \
            "$BUNDLE_IDENTIFIER" \
            --screenshot-demo \
            > /dev/null

          echo "Catalog is ready; waiting 3 seconds for visual stabilization."
          sleep 3

          mkdir -p "$SCREENSHOT_DIRECTORY"
          FINAL_SCREENSHOT="$SCREENSHOT_DIRECTORY/vinylshelf-catalog.png"
          SCREENSHOT_VALID=false

          for attempt in {1..3}; do
            CANDIDATE_SCREENSHOT="$RUNNER_TEMP/vinylshelf-catalog-attempt-$attempt.png"

            xcrun simctl io \
              "$SIMULATOR_UDID" \
              screenshot \
              "$CANDIDATE_SCREENSHOT"

            if "$RUNNER_TEMP/validate-screenshot" "$CANDIDATE_SCREENSHOT"; then
              mv "$CANDIDATE_SCREENSHOT" "$FINAL_SCREENSHOT"
              SCREENSHOT_VALID=true
              echo "Screenshot accepted on attempt $attempt."
              break
            fi

            echo "Screenshot attempt $attempt was rejected; waiting before retry."
            sleep 2
          done

          if [[ "$SCREENSHOT_VALID" != "true" ]]; then
            echo "No screenshot passed visual validation."
            exit 1
          fi

          test -s "$FINAL_SCREENSHOT"

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: vinylshelf-ios-screenshots
          path: ${{ github.workspace }}/screenshots/*.png
          if-no-files-found: error
          retention-days: 30

      - name: Delete temporary simulator
        if: always()
        run: |
          if [[ -n "${SIMULATOR_UDID:-}" ]]; then
            xcrun simctl shutdown "$SIMULATOR_UDID" || true
            xcrun simctl delete "$SIMULATOR_UDID" || true
          fi
