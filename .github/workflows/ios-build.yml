name: iOS Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Test VinylShelfCore
        run: swift test --package-path VinylShelfCore

      - name: Build for iOS Simulator
        run: |
          xcodebuild \
            -project VinylShelf.xcodeproj \
            -scheme VinylShelf \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/VinylShelfDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Test iOS application
        run: |
          xcodebuild \
            -project VinylShelf.xcodeproj \
            -scheme VinylShelf \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest' \
            -derivedDataPath "$RUNNER_TEMP/VinylShelfDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            test
