name: VinylShelf

packages:
  VinylShelfCore:
    path: VinylShelfCore

targets:
  VinylShelf:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: VinylShelf
    dependencies:
      - package: VinylShelfCore
        product: VinylShelfCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.renan.VinylShelf
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"

schemes:
  VinylShelf:
    build:
      targets:
        VinylShelf: all
    run:
      config: Debug
